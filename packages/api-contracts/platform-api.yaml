            text/csv:
              schema:
                type: string
        "401":
          description: Authentication required
  /api/v1/plants/import-template:
    get:
      operationId: plantDeviceCSVTemplate
      summary: Download a header-only CSV for the Plant/Device import format
      security:
        - cookieAuth: []
      responses:
        "200":
          description: plant-device-template.csv
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Authentication required
  /api/v1/plants/import:
    post:
      operationId: importPlantsDevicesCSV
      summary: Upsert Plants (matched by code) and Devices (matched by external_id within the Plant) from an uploaded CSV -- never deletes rows the CSV omits
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                organizationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportResult"
        "400":
          description: Invalid CSV upload
        "401":
          description: Authentication required
  /api/v1/plants/{plantId}:
    parameters:
      - name: plantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPlant
      summary: Get one plant through the caller's organization and plant scope
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Plant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "401":
          description: Authentication required
        "404":
          description: Plant is missing or outside the caller's scope
    put:
      operationId: updatePlant
      summary: Replace editable plant master data and append an audit event
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlantRequest"
      responses:
        "200":
          description: Plant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          description: Invalid plant data
        "401":
          description: Authentication required
        "404":
          description: Plant is missing or outside the caller's update scope
        "409":
          description: Plant code already exists in the organization
    delete:
      operationId: hardDeletePlant
      summary: Permanently delete a Plant, its Devices, metadata and normalized telemetry
      description: System Admin only. Requires the exact confirmation header `DELETE`.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/HardDeleteConfirmation"
      responses:
        "204":
          description: Plant and dependent operational data deleted
        "400":
          description: Confirmation header is invalid
        "401":
          description: Authentication required
        "403":
          description: Missing global Plant hard-delete permission
        "404":
          description: Plant is missing
  /api/v1/plants/{plantId}/image:
    parameters:
      - name: plantId
