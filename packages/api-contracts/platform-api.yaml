            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        "400":
          description: Invalid stale threshold
        "401":
          description: Authentication required
        "403":
          description: Missing Device read permission
  /api/v1/dashboard/layout:
    get:
      operationId: getOwnDashboardLayout
      summary: Return the caller's private draft Overview layout and edit capabilities
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Saved layout or the unsaved registry default at version zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLayout"
        "401":
          description: Authentication required
        "403":
          description: Missing Dashboard read permission
    put:
      operationId: saveOwnDashboardLayout
      summary: Create or update the caller's private draft Overview layout with optimistic concurrency
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDashboardLayoutRequest"
      responses:
        "200":
          description: Saved layout with incremented version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLayout"
        "400":
          description: Invalid widget layout
        "401":
          description: Authentication required
        "403":
          description: Missing Dashboard update permission or CSRF token
        "409":
          description: Layout was changed by another request
  /api/v1/dashboard/layout/published:
    get:
      operationId: getOwnPublishedDashboardLayout
      summary: Return the caller's published Overview snapshot or the registry default
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Published snapshot; version zero is the unsaved registry default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedDashboardLayout"
        "401":
          description: Authentication required
        "403":
          description: Missing Dashboard read permission
  /api/v1/dashboard/layout/publish:
    post:
      operationId: publishOwnDashboardLayout
      summary: Atomically copy the current private draft into the published snapshot
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishDashboardLayoutRequest"
      responses:
        "200":
          description: Published snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedDashboardLayout"
        "400":
          description: No saved draft or invalid version
        "401":
          description: Authentication required
        "403":
          description: Missing Dashboard publish permission or CSRF token
        "409":
          description: Draft or published snapshot changed by another request
  /api/v2/ingestion/register-readings:
    post:
      tags: [Middleware Ingestion]
      operationId: ingestRawRegisterBatch
      summary: Accept decoded raw Modbus register readings without canonical mapping
      security:
        - middlewareApiKey: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ContentEncoding"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawRegisterBatch"
            examples:
              holdingRegisterReading:
                summary: Decoded raw registers before scaling and unit conversion
                value:
                  schemaVersion: "2.0"
                  data:
                    - gatewayId: gateway-site-01
                      devDn: INV-01
                      devName: Inverter 01
                      plantCode: PLANT-01
                      plantName: Solar Plant 01
                      devTypeId: 1
                      model: vendor-model
                      collectTime: 1784861728860
                      registerAddressMap:
                        "40084": 2518
      responses:
        "202":
          description: Raw register batch durably accepted
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawRegisterIngestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Caller correlation ID using 1-100 ASCII letters, digits, dot, underscore, colon or hyphen. Invalid or missing values are replaced.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[A-Za-z0-9._:-]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable retry key. When omitted, the server derives one from the exact decompressed request body for deployed Middleware compatibility.
      schema:
        type: string
        maxLength: 200
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: Optional request compression.
      schema:
        type: string
        enum: [identity, gzip]
    HardDeleteConfirmation:
      name: X-Hard-Delete-Confirm
      in: header
      required: true
      description: Exact text `DELETE`. Longer legacy phrases remain accepted for compatibility.
      schema:
        type: string
        enum: [DELETE]
  headers:
    CorrelationId:
      description: Correlation ID accepted from the request or generated by the Platform.
      schema:
        type: string
        minLength: 1
        maxLength: 100
  responses:
    BadRequest:
      description: Invalid batch envelope or record-independent validation failure
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: Missing, inactive or invalid Middleware API key
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        text/plain:
          schema: { type: string }
    Conflict:
      description: Idempotency key was reused with a different decompressed payload
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        text/plain:
          schema: { type: string }
    PayloadTooLarge:
      description: Decompressed request body exceeds 1 MiB
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        text/plain:
          schema: { type: string }
    UnsupportedMediaType:
      description: Content-Type is not application/json or Content-Encoding is unsupported
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        text/plain:
          schema: { type: string }
    InternalServerError:
      description: Internal ingestion failure; retry with the same Idempotency-Key
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        text/plain:
          schema: { type: string }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    middlewareApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, ready]
        version:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [organizationCode, email, password]
      properties:
        organizationCode:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
        username:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Normalized email address or username
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required: [expiresAt, user]
