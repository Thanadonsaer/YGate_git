          description: Authentication required
        "403":
          description: Missing Middleware client update permission
        "404":
          description: API key client is missing or outside scope
  /api/v1/admin/api-keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateAdminAPIKey
      summary: Update a Middleware API key client without rotating or exposing its secret
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAPIKeyRequest"
      responses:
        "200":
          description: API key client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyClient"
        "400":
          description: Invalid API key client data
        "401":
          description: Authentication required
        "403":
          description: Missing Middleware client update permission
        "404":
          description: API key client is missing or outside scope
        "409":
          description: API key client name already exists
    delete:
      operationId: hardDeleteAdminAPIKey
      summary: Permanently delete a Middleware API key client and its ingestion data
      description: System Admin only. Requires the exact confirmation header `DELETE`.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/HardDeleteConfirmation"
      responses:
        "204":
          description: API key client and dependent ingestion data deleted
        "400":
          description: Confirmation header is invalid
        "401":
          description: Authentication required
        "403":
          description: Missing global Middleware client hard-delete permission
        "404":
          description: API key client is missing
  /api/v1/admin/middlewares:
    get:
      operationId: listAdminMiddlewares
      summary: List middleware gateways (site polling agents) without returning secrets
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Permission-scoped middleware gateways
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/MiddlewareGateway"
        "401":
          description: Authentication required
        "403":
          description: Missing Middleware client read permission
    post:
      operationId: createAdminMiddleware
      summary: Register a new middleware gateway and return its API key once
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMiddlewareRequest"
      responses:
        "201":
          description: Middleware gateway created; apiKey is shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMiddlewareGateway"
        "400":
          description: Invalid middleware gateway data
        "401":
          description: Authentication required
        "403":
          description: Missing Middleware client create permission
        "409":
          description: Middleware gateway name already exists
  /api/v1/admin/middlewares/{middlewareId}:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateAdminMiddleware
      summary: Update a middleware gateway's name, site name, or active status
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMiddlewareRequest"
      responses:
        "200":
          description: Middleware gateway updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiddlewareGateway"
        "400":
          description: Invalid middleware gateway data
        "401":
          description: Authentication required
        "403":
          description: Missing Middleware client update permission
        "404":
          description: Middleware gateway is missing or outside scope
  /api/v1/admin/middlewares/{middlewareId}/config:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAdminMiddlewareConfig
      summary: Get a middleware gateway's last computed-and-pushed config snapshot (read-only; computed from assigned Plants' Devices, not admin-authored)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Last computed config snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiddlewareConfigSnapshot"
        "401":
          description: Authentication required
        "403":
          description: Missing middleware config read permission
        "404":
          description: Middleware gateway is missing or outside scope
  /api/v1/admin/middlewares/{middlewareId}/import-config:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: importAdminMiddlewareConfig
      summary: Pull a middleware gateway's local config live over the realtime channel (config-export command), and upsert Device Models + Register Metadata from it. One-time onboarding import, not an ongoing sync.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Import result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMiddlewareConfigResult"
        "400":
          description: Invalid data in the imported config
        "401":
          description: Authentication required
        "403":
          description: Missing middleware config update permission
        "404":
          description: Middleware gateway is missing or outside scope
        "503":
          description: Middleware gateway is offline
        "504":
          description: Middleware gateway did not respond in time
  /api/v1/admin/middlewares/{middlewareId}/push-config:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: pushAdminMiddlewareConfig
      summary: Explicitly recompute a middleware gateway's config from current Device/DeviceModel/Plant data and push it over the realtime channel. Config is never pushed automatically -- this is the only trigger.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Config recomputed and, if the gateway is connected, pushed. Counts reflect what buildConfigSnapshot actually included -- deviceCount 0 with plantCount > 0 means every assigned Plant's Devices are missing Modbus host/port, or their Device Model has no Register Metadata with a Modbus function code set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfigResult"
        "401":
          description: Authentication required
        "403":
          description: Missing middleware config update permission
        "404":
          description: Middleware gateway is missing or outside scope
  /api/v1/admin/middlewares/{middlewareId}/update/stage:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: stageAdminMiddlewareUpdate
      summary: Tell a connected middleware gateway to download and stage a previously-uploaded patch, ready for Apply. System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patchId]
              properties:
                patchId: { type: string, format: uuid }
      responses:
        "204":
          description: Patch staged on the middleware
        "400":
          description: Invalid patch id, or PLATFORM_PUBLIC_BASE_URL is not configured
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch update permission
        "404":
          description: Middleware gateway or patch not found
        "503":
          description: Middleware gateway is offline
        "504":
          description: Middleware gateway did not respond in time
  /api/v1/admin/middlewares/{middlewareId}/update/apply:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: applyAdminMiddlewareUpdate
      summary: Apply whatever patch is currently staged on the middleware gateway -- backs up the running binary, restarts the service with the staged one. System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Update started; the gateway will restart
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch update permission
        "404":
          description: Middleware gateway not found
        "503":
          description: Middleware gateway is offline
        "504":
          description: Middleware gateway did not respond in time
  /api/v1/admin/middlewares/{middlewareId}/update/rollback:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rollbackAdminMiddlewareUpdate
      summary: Roll a middleware gateway back to its last backed-up binary. System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Rollback started; the gateway will restart
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch update permission
        "404":
          description: Middleware gateway not found
        "503":
          description: Middleware gateway is offline
        "504":
          description: Middleware gateway did not respond in time
  /api/v1/admin/middlewares/{middlewareId}/restart:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restartAdminMiddleware
      summary: Restart a middleware gateway's service without changing its binary. System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Restart started
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch update permission
        "404":
          description: Middleware gateway not found
        "503":
          description: Middleware gateway is offline
        "504":
          description: Middleware gateway did not respond in time
  /api/v1/admin/middleware-patches:
    get:
      operationId: listAdminMiddlewarePatches
      summary: List uploaded middleware software patches. System Admin only.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Patch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MiddlewarePatch"
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch read permission
    post:
      operationId: uploadAdminMiddlewarePatch
      summary: Upload a middleware software patch zip (update-manifest.json + signed binary). System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                patch: { type: string, format: binary }
      responses:
        "200":
          description: Patch stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiddlewarePatch"
        "400":
          description: Invalid patch zip (manifest, signature, or sha256 mismatch)
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch create permission
        "409":
          description: A patch for this version/os/arch already exists
  /api/v1/admin/middleware-patches/{patchId}:
    parameters:
      - name: patchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteAdminMiddlewarePatch
      summary: Delete an uploaded middleware software patch. System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Patch deleted
        "401":
          description: Authentication required
        "403":
          description: Missing middleware_patch delete permission
        "404":
          description: Patch not found
  /api/v1/admin/middleware-patches/{patchId}/download:
    parameters:
      - name: patchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadAdminMiddlewarePatch
      summary: Download a patch zip. Called by a Middleware gateway itself (X-Api-Key auth, not a browser session) after receiving an update.stage command.
      security:
        - middlewareApiKey: []
      responses:
        "200":
          description: Patch zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Patch not found
  /api/v1/admin/middlewares/{middlewareId}/plants:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAdminMiddlewarePlants
      summary: List the Plants currently assigned to a middleware gateway
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Assigned plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plant"
        "401":
          description: Authentication required
        "403":
          description: Missing middleware plant read permission
    post:
      operationId: assignAdminMiddlewarePlant
      summary: Assign a Plant to a middleware gateway (reassigns it away from any other gateway that held it -- one gateway per Plant)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plantId]
              properties:
                plantId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Plant assigned; both the newly- and previously-assigned gateway (if different) have their config recomputed and pushed
        "400":
          description: Invalid plant id, or plant belongs to a different organization
        "401":
          description: Authentication required
        "403":
          description: Missing middleware plant update permission
        "404":
          description: Middleware gateway is missing or outside scope
  /api/v1/admin/middlewares/{middlewareId}/plants/{plantId}:
    parameters:
      - name: middlewareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: plantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: unassignAdminMiddlewarePlant
      summary: Unassign a Plant from a middleware gateway
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Plant unassigned; the gateway's config is recomputed and pushed
        "401":
          description: Authentication required
        "403":
          description: Missing middleware plant update permission
        "404":
          description: Middleware gateway, plant, or assignment not found
  /api/v1/gateway/realtime:
    get:
      operationId: connectGatewayRealtime
      summary: Outbound-initiated WebSocket used by a middleware instance to sync config and relay commands
      description: Machine-to-machine channel, authenticated like the ingestion endpoints (X-Api-Key), not a browser session.
      security:
        - apiKeyAuth: []
      responses:
        "101":
          description: WebSocket connection established; exchanges hello/config.snapshot/config.ack/command.request/command.result frames
        "401":
          description: Invalid or missing middleware API key
  /api/v1/realtime:
    get:
      operationId: connectRealtime
      summary: Upgrade an authenticated browser session to the realtime WebSocket channel
      security:
        - cookieAuth: []
      parameters:
        - name: plantId
          in: query
          required: false
          description: When present, emit permission-scoped telemetry.snapshot frames for this Plant
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: WebSocket connection established; emits RealtimeMessage JSON frames
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: Browser origin is not allowed
  /api/v1/plants:
    get:
      operationId: listPlants
      summary: List up to 200 plants within the caller's granted organization and plant scopes
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Permission-scoped plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plant"
        "401":
          description: Authentication required
        "403":
          description: Missing plant read permission
    post:
      operationId: createPlant
      summary: Create an audited plant within an organization scope granted to the caller
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlantRequest"
      responses:
        "201":
          description: Plant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          description: Invalid plant data
        "401":
          description: Authentication required
        "403":
          description: Missing create permission for the requested organization scope
        "409":
