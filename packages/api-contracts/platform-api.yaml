          description: Device rows created from Connections, matched to an existing Plant by PlantCode and given a new external_id (DevDn)
        devicesUpdated:
          type: integer
          description: Existing Device rows (matched by Plant + external_id) whose modbusHost/modbusPort/modbusUnitId were overwritten from this import
