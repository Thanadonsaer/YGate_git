                  type: string
                  format: binary
      responses:
        "200":
          description: Plant with the new image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          description: Missing, unsupported, or over-sized image
        "401":
          description: Authentication required
        "403":
          description: Missing Plant update permission
        "404":
          description: Plant is missing or outside the caller's scope
    delete:
      operationId: deletePlantImage
      summary: Remove the primary Plant image
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Plant with image URL cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "401":
          description: Authentication required
        "403":
          description: Missing Plant update permission
        "404":
          description: Plant is missing or outside the caller's scope
