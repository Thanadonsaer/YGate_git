openapi: 3.1.0
info:
  title: Solar SCADA Platform API
  version: 0.5.0
  description: |
    Versioned contract for the read-only Solar SCADA Platform. Browser APIs use
    secure session cookies and CSRF protection. Middleware pushes telemetry with
    a scoped X-Api-Key; the Platform never initiates connections into Site OT.
x-compatibility-notes:
  - SCADA designs add resizable shape, section, LED, clock, image, table, alarm-list and ticker node types; existing version 1 designs remain valid.
  - Destructive browser actions now accept the literal DELETE confirmation; legacy resource-specific phrases remain accepted by the backend.
  - Phase 3B adds Plant-scoped SCADA screen draft, immutable publication history, rollback and hard-delete APIs.
  - Self-profile management, privileged hard delete, and explicit clear operations are additive browser APIs.
  - Ingestion response property names now document the backend's existing acceptedCount/duplicateCount/rejectedCount JSON fields.
  - X-Correlation-ID, gzip documentation and examples are additive.
  - Register ingestion is v2 only (schemaVersion 2.0, registerAddressMap). The v1
    dataItemMap endpoints have been removed; scaling is applied at read time from
    Register Metadata.
servers:
  - url: http://localhost:44440
    description: Local API Gateway
tags:
  - name: Middleware Ingestion
    description: Idempotent outbound telemetry ingestion from Site Middleware
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report process and PostgreSQL readiness
      responses:
        "200":
          description: Process and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: PostgreSQL is unavailable
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a browser session with an email or username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session and CSRF tokens are returned only in cookies
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials, disabled account, or locked account
        "415":
          description: Content type is not application/json
        "429":
          description: Too many recent failed attempts
        "500":
          description: Internal error
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a disabled account and send an email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration accepted; the account remains disabled until email verification and Admin approval
        "400":
          description: Invalid registration data
        "409":
          description: Email or username is already in use
        "503":
          description: Email verification delivery is not configured
  /api/v1/auth/verify-email:
    get:
      operationId: verifyEmail
      summary: Verify a registered account email address
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified; Admin approval is still required before login
        "400":
          description: Token is invalid or expired
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend an email verification link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: Request accepted
        "400":
          description: Invalid request
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginUser"
        "401":
          description: Session is missing, expired, or revoked
  /api/v1/auth/profile:
    get:
      operationId: getOwnProfile
      summary: Return editable profile fields for the authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user's editable profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfProfile"
        "401":
          description: Session is missing, expired, or revoked
    put:
      operationId: updateOwnProfile
      summary: Update the authenticated user's email, username and display name
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfProfile"
        "400":
          description: Invalid profile data
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: CSRF token is missing or invalid
        "409":
          description: Email or username is already in use
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Current session revoked and cookies expired
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: CSRF token is missing or invalid
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session for the authenticated user
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: All user sessions revoked and cookies expired
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: CSRF token is missing or invalid
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password and revoke other sessions
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; current session remains active
        "400":
          description: Current password is invalid or the new password fails policy
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: CSRF token is missing or invalid
        "415":
          description: Content type is not application/json
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a one-time password reset link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Request accepted for both known and unknown accounts
        "400":
          description: Invalid request
        "415":
          description: Content type is not application/json
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a one-time reset token, change the password, and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed and all sessions revoked
        "400":
          description: Token is invalid or expired, or the password fails policy
        "415":
          description: Content type is not application/json
        "429":
          description: Too many recent reset attempts
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List up to 100 sessions owned by the authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User sessions, including expired and revoked history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSession"
        "401":
          description: Session is missing, expired, or revoked
    delete:
      operationId: clearOwnSessions
      summary: Permanently delete every session record owned by the authenticated user
      description: The current session is deleted too, so the caller is logged out. Requires the exact confirmation header.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/HardDeleteConfirmation"
      responses:
        "204":
          description: All owned session records deleted and cookies expired
        "400":
          description: Confirmation header does not equal DELETE
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: CSRF token is missing or invalid
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session owned by the authenticated user
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked; cookies expire when revoking the current session
        "401":
          description: Session is missing, expired, or revoked
        "403":
          description: CSRF token is missing or invalid
        "404":
          description: Session is not owned by the authenticated user
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: List users in organizations where the caller has user-read permission
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Permission-scoped users
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "401":
          description: Authentication required
        "403":
          description: Missing user read permission
    post:
      operationId: createAdminUser
      summary: Create a user and assign one baseline role within an authorized organization
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid user data
        "401":
          description: Authentication required
        "403":
          description: Missing user create or role assign permission
        "409":
          description: Email or username already exists
  /api/v1/admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateAdminUser
      summary: Update a user's profile, baseline role and active status
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: User updated and active sessions revoked when disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid user data or unsafe self/last-admin change
        "401":
          description: Authentication required
        "403":
          description: Missing user update/disable or role assign permission
        "404":
          description: User is missing or outside scope
        "409":
          description: Email or username already exists
    delete:
      operationId: hardDeleteAdminUser
      summary: Permanently delete a User and owned dependent records
      description: System Admin only. Audit rows and actor UUIDs remain append-only. The current user and final active System Admin cannot be deleted.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: X-Hard-Delete-Confirm
          in: header
          required: true
          description: Exact text `DELETE`.
          schema:
            type: string
            enum: [DELETE]
      responses:
        "204":
          description: User permanently deleted
        "400":
          description: Confirmation mismatch, self-delete, or final System Admin
        "401":
          description: Authentication required
        "403":
          description: Missing global hard_delete user permission
        "404":
          description: User does not exist
  /api/v1/admin/organizations:
    get:
      operationId: listAdminOrganizations
      summary: List organizations visible to the caller (all for a global read grant, only the caller's own for an org-scoped grant)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Organizations visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          description: Authentication required
        "403":
          description: Missing organization read permission
    post:
      operationId: createAdminOrganization
      summary: Create a new organization (requires global organization-create permission)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid organization data
        "401":
          description: Authentication required
        "403":
          description: Missing global organization create permission
        "409":
          description: Organization code already in use
  /api/v1/admin/organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateAdminOrganization
      summary: Rename, re-code, or activate/deactivate an organization
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid organization data
        "401":
          description: Authentication required
        "403":
          description: Missing organization update permission for this organization
        "404":
          description: Organization does not exist
        "409":
          description: Organization code already in use
  /api/v1/admin/roles:
    get:
      operationId: listAdminRoles
      summary: List baseline roles available for user assignment
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Roles visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          description: Authentication required
        "403":
          description: Missing role read permission
    post:
      operationId: createAdminRole
      summary: Create a custom, non-system role with an initial permission set
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "400":
          description: Invalid role data
        "401":
          description: Authentication required
        "403":
          description: Missing role create permission for the requested scope
        "409":
          description: Role name already exists in scope
  /api/v1/admin/roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAdminRole
      summary: Get a role's org scope and granted permission ids
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "401":
          description: Authentication required
        "403":
          description: Missing role read permission for the role's scope
        "404":
          description: Role does not exist
    put:
      operationId: updateAdminRole
      summary: Rename a custom role and replace its permission set
      description: System roles are immutable and always return 403.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "400":
          description: Invalid role data
        "401":
          description: Authentication required
        "403":
          description: Role is a system role, or missing role update permission for its scope
        "404":
          description: Role does not exist
        "409":
          description: Role name already exists in scope
    delete:
      operationId: deleteAdminRole
      summary: Delete a custom role that is not assigned to any user
      description: System roles are immutable and always return 403.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Role deleted
        "401":
          description: Authentication required
        "403":
          description: Role is a system role, or missing role delete permission for its scope
        "404":
          description: Role does not exist
        "409":
          description: Role is still assigned to one or more users
  /api/v1/admin/permissions:
    get:
      operationId: listAdminPermissions
      summary: List the full permission catalog for building a role's permission picker
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          description: Authentication required
        "403":
          description: Missing role read permission
  /api/v1/admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: updateAdminUserStatus
      summary: Enable or disable a user and revoke sessions when disabling
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid user status request
        "401":
          description: Authentication required
        "403":
          description: Missing user update or disable permission
        "404":
          description: User is missing or outside scope
  /api/v1/admin/users/{userId}/unlock:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: unlockAdminUser
      summary: Clear login lock and failed-login count for a scoped user
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: User unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "401":
          description: Authentication required
        "403":
          description: Missing user unlock permission
        "404":
          description: User is missing or outside scope
  /api/v1/admin/users/{userId}/reset-password:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resetAdminUserPassword
      summary: Administratively replace a scoped user's password and revoke every session
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetUserPasswordRequest"
      responses:
        "204":
          description: Password changed, login lock cleared and sessions revoked
        "400":
          description: Password does not meet policy
        "401":
          description: Authentication required
        "403":
          description: Missing reset_password user permission
        "404":
          description: User is missing or outside scope
  /api/v1/admin/openapi:
    get:
      operationId: getAdminOpenAPI
      summary: Return the current Platform API OpenAPI YAML contract
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
        "401":
          description: Authentication required
        "403":
          description: Missing API contract read permission
        "503":
          description: Contract file is unavailable
  /api/v1/site-settings:
    get:
      operationId: getSiteSettings
      summary: Read the configured site name, logo, and accent color
      description: Unauthenticated -- the login screen renders the configured branding before a session exists.
      responses:
        "200":
          description: Current site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSiteSettings
      summary: Change the site name and accent color
      description: System Admin only. Logo is managed separately via /api/v1/site-settings/logo.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteSettingsRequest"
      responses:
        "200":
          description: Updated site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid site name or accent color
        "401":
          description: Authentication required
        "403":
          description: Missing global site_setting update permission
  /api/v1/site-settings/logo:
    post:
      operationId: uploadSiteLogo
      summary: Upload the site logo (png/jpeg/svg/webp/gif, up to 2 MiB). System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo: { type: string, format: binary }
      responses:
        "200":
          description: Updated site settings with the new logo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Missing file, unsupported image type, or over 2 MiB
        "401":
          description: Authentication required
        "403":
          description: Missing global site_setting update permission
    delete:
      operationId: deleteSiteLogo
      summary: Remove the configured site logo, reverting to the default mark. System Admin only.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Updated site settings with logoUrl cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          description: Authentication required
        "403":
          description: Missing global site_setting update permission
  /api/v1/site-settings/logo/{filename}:
    get:
      operationId: getSiteLogoFile
      summary: Fetch the uploaded site logo image
      description: Unauthenticated -- the login screen renders the logo before a session exists.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logo image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No logo file with that name
  /api/v1/admin/audit:
    get:
      operationId: listAdminAuditEvents
      summary: List permission-scoped append-only audit events
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Recent audit events in the caller's authorized scope
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "400":
          description: Invalid limit
        "401":
          description: Authentication required
        "403":
          description: Missing audit read permission
    delete:
      operationId: clearAdminAuditEvents
      summary: Clear the visible audit history and append one audit.cleared marker
      description: System Admin only. Append-only source rows remain immutable; subsequent list calls hide rows at or before the latest global clear marker.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/HardDeleteConfirmation"
      responses:
        "200":
          description: Previous audit events hidden from the operational view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearResult"
        "400":
          description: Confirmation header does not equal DELETE
        "401":
          description: Authentication required
        "403":
          description: Missing global audit clear permission
  /api/v1/admin/api-keys:
    get:
      operationId: listAdminAPIKeys
      summary: List Middleware API key clients without returning secrets
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Permission-scoped Middleware API key clients
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/APIKeyClient"
        "401":
          description: Authentication required
        "403":
          description: Missing Middleware client read permission
    post:
      operationId: createAdminAPIKey
      summary: Create a Middleware API key client and return the secret once
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
